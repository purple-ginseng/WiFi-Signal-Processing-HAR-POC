[pytest]
# Only tests/ — the root-level test_csi_*.py / test_serial.py are legacy
# hardware scripts, not pytest suites.
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    gui: needs a display (real X server or `xvfb-run -a`)
    tshark: needs a working tshark binary on PATH
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
